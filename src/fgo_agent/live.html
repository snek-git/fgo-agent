<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaldea Terminal · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* The game screen, playable: click = tap, drag = swipe, hold = long press, Esc = back.
     Same look as the board (FGO's light menus). ?embed=1 drops the page background for the board's tab. */
  :root { --ink: #10213f; --ink2: #2a4472; --muted: #5d7398; --rim: #7ec2f2; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 14px/1.45 "Noto Sans JP", system-ui, sans-serif; min-height: 100vh;
         background: repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 1px, transparent 1px 34px),
                     repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 1px, transparent 1px 34px),
                     linear-gradient(180deg, #bfe3ff 0%, #8ccaf6 40%, #5eaee9 100%); background-attachment: fixed; }
  body.embed { background: transparent; min-height: 0; overflow: hidden auto; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  body.embed .wrap { padding: 0; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .state { padding: 3px 12px; border-radius: 12px; font-weight: 700; font-size: 12px; color: #fff; background: #7d93b5; }
  .state.on { background: #2f9a58; } .state.view { background: #d9822b; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  button { font: 700 13px "Noto Sans JP", sans-serif; cursor: pointer; white-space: nowrap; padding: 5px 12px; border-radius: 4px;
           color: #fff; background: linear-gradient(180deg, #4aa8f0, #1f72c8); border: 1px solid #bfe3ff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.25); }
  button.light { color: var(--ink); background: linear-gradient(180deg, #ffffff, #dbe8f5); border-color: #7e9cc4; }
  button.go { padding: 8px 26px; border-radius: 999px; color: var(--ink); background: linear-gradient(180deg, #ffffff, #e6eef6);
              border: 3px solid #2a8be0; box-shadow: 0 0 0 2px #fff, 0 0 0 3px #7ec2f2, 0 3px 6px rgba(0,0,0,.25); font-size: 15px; font-weight: 900; }
  button:disabled { filter: grayscale(.8) opacity(.5); cursor: default; }
  .screen { position: relative; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 64px) * 16 / 9)); margin: 0 auto; border-radius: 6px; overflow: hidden; background: #0b1730;
            border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rim), 0 6px 16px rgba(10, 40, 90, .3); touch-action: none; user-select: none; }
  .screen img { width: 100%; height: 100%; display: block; object-fit: contain; -webkit-user-drag: none; }
  .screen.play { cursor: crosshair; }
  .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #dbe9ff; background: linear-gradient(180deg, #16305f, #0b1730); }
  .off h2 { margin: 0 0 12px; font-weight: 900; }
  .ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #fff; pointer-events: none;
            box-shadow: 0 0 8px #59b4ff; animation: ripple .45s ease-out forwards; }
  @keyframes ripple { to { transform: scale(2.2); opacity: 0; } }
  /* Screen on the left, the agent's log beside it at the screen's height; stacked on narrow screens */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
  .layout .screen { margin: 0 0 0 auto; }
  .log { position: relative; min-height: 260px; border-radius: 6px; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(232, 244, 255, .94));
         border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rim), 0 4px 12px rgba(30, 90, 160, .25); }
  .log .in { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: linear-gradient(180deg, #1a2f57, #2a4a80); color: #fff; font-weight: 700; flex: none; }
  .head .meta { margin-left: auto; font-size: 11px; font-weight: 400; color: #bcdcff; display: flex; gap: 10px; }
  .head .meta b { color: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e05a5a; flex: none; }
  .dot.live { background: #5fd08a; box-shadow: 0 0 6px #5fd08a; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .ev { background: #fff; border: 1px solid #cfe2f5; border-left: 3px solid var(--rim); border-radius: 4px; padding: 4px 8px; font-size: 12px; word-break: break-word; }
  .ev .t { color: var(--muted); font-size: 10px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .ev.say { border-left-color: #2a8be0; font-size: 13px; white-space: pre-wrap; }
  .ev.think, .ev.prompt { color: var(--muted); white-space: pre-wrap; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ev.think { border-left-color: #a58bd8; font-style: italic; }
  .ev.prompt { border-left-color: #d9822b; }
  .ev.open { display: block; -webkit-line-clamp: unset; }
  .ev.call { border-left-color: #1a2f57; }
  .ev.call .name { font-weight: 700; color: var(--ink); font-family: ui-monospace, monospace; }
  .ev.call .args { color: var(--ink2); font-family: ui-monospace, monospace; font-size: 11px; margin-left: 6px; }
  .ev.call:not(.open) .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .ev.call.open .line { cursor: pointer; }
  .ev .pending { color: var(--muted); font-size: 11px; }
  .ev.err { border-left-color: #d33f3f; background: #fff3f3; }
  .res summary { cursor: pointer; list-style: none; color: #2f7a4b; font: 11px/1.5 ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res summary::before { content: "▸ "; color: var(--muted); }
  .res[open] summary::before { content: "▾ "; }
  .res[open] summary { white-space: normal; }
  .ev.err .res summary { color: #c03535; }
  .res pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font: 11px/1.4 ui-monospace, monospace; max-height: 300px; overflow: auto;
             background: #f2f8fe; border: 1px solid #cfe2f5; border-radius: 4px; padding: 6px; color: var(--ink); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 12px; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .layout .screen { margin: 0 auto; }
    .log { height: 55vh; }
  }
  .toast { position: fixed; right: 16px; bottom: 16px; background: #fff; color: var(--ink); border: 1px solid var(--rim); padding: 10px 14px; border-radius: 6px; display: none; box-shadow: 0 4px 14px rgba(10, 40, 90, .3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="state" id="state">checking</span>
    <button class="light" id="startBtn">Start game</button>
    <button class="light" id="stopBtn">Stop game</button>
    <button id="backBtn" title="Android back (Esc)">◀ Back</button>
    <button class="light" id="soundBtn">🔇 Sound off</button>
    <button class="light" id="windowBtn" title="scrcpy window: no lag, for real-time play">Open game window</button>
    <span class="hint" id="hint">click = tap · drag = swipe · hold = long press · Esc = back</span>
  </div>
  <div class="layout">
    <div class="screen" id="screen">
      <img id="img" alt="">
      <div class="off" id="off"><div><h2>The game is off</h2><button class="go" id="startBig">Start game</button></div></div>
    </div>
    <div class="log"><div class="in">
      <div class="head"><span class="dot" id="dot"></span>Agent log
        <span class="meta"><span>actions <b id="count">0</b></span><span id="costBox" hidden>cost <b id="cost"></b></span><span id="session"></span></span></div>
      <div id="list"><div class="empty">No agent session yet</div></div>
    </div></div>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
if (new URLSearchParams(location.search).get("embed")) document.body.classList.add("embed");
let running = false, busy = null, streaming = false;

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._h); el._h = setTimeout(() => el.style.display = "none", 3500); }
async function call(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

function render() {
  $("state").className = "state " + (!running ? "" : busy ? "view" : "on");
  $("state").textContent = !running ? "Game off" : busy ? "View only: " + busy : "Playable";
  $("off").style.display = running ? "none" : "grid";
  $("screen").classList.toggle("play", running && !busy);
  $("startBtn").disabled = running; $("stopBtn").disabled = !running || !!busy; $("backBtn").disabled = !running || !!busy;
  $("windowBtn").disabled = !!busy;
  if (running && !streaming) { $("img").src = "/screen.mjpg?t=" + Date.now(); streaming = true; }
  if (!running && streaming) { $("img").removeAttribute("src"); streaming = false; }
}
async function poll() {
  try { const s = await (await fetch("/api/game")).json(); running = s.running; busy = s.busy; render(); } catch (e) {}
}

async function start() {
  $("startBtn").disabled = $("startBig").disabled = true; toast("starting the emulator and FGO (about 30 seconds)");
  try { const s = await call("/api/game", {action: "up"}); running = s.running; busy = s.busy; render(); }
  catch (e) { toast(e.message); } finally { $("startBig").disabled = false; render(); }
}
$("startBtn").onclick = start; $("startBig").onclick = start;
$("stopBtn").onclick = async () => { try { const s = await call("/api/game", {action: "down"}); running = s.running; render(); } catch (e) { toast(e.message); } };
$("backBtn").onclick = () => call("/api/control", {type: "back"}).catch((e) => toast(e.message));
$("windowBtn").onclick = () => call("/api/game/window").then(() => toast("opening the game window")).catch((e) => toast(e.message));
$("soundBtn").onclick = () => {
  const a = $("audio");
  if (a.paused) { a.src = "/audio.mp3?t=" + Date.now(); a.play().catch((e) => toast("sound: " + e.message)); $("soundBtn").textContent = "🔊 Sound on"; }
  else { a.pause(); a.removeAttribute("src"); a.load(); $("soundBtn").textContent = "🔇 Sound off"; }
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && running && !busy) call("/api/control", {type: "back"}).catch((err) => toast(err.message)); });

// Pointer → tap / swipe / long press, as fractions of the game picture (letterboxing removed)
const scr = $("screen");
function frac(e) {
  const r = $("img").getBoundingClientRect(), ratio = 16 / 9;
  let w = r.width, h = r.width / ratio; if (h > r.height) { h = r.height; w = h * ratio; }
  const x0 = r.left + (r.width - w) / 2, y0 = r.top + (r.height - h) / 2;
  return {x: (e.clientX - x0) / w, y: (e.clientY - y0) / h, px: e.clientX - scr.getBoundingClientRect().left, py: e.clientY - scr.getBoundingClientRect().top};
}
let down = null;
scr.addEventListener("pointerdown", (e) => { if (!running || busy) return; scr.setPointerCapture(e.pointerId); down = {...frac(e), t: performance.now()}; });
scr.addEventListener("pointerup", (e) => {
  if (!down) return;
  const up = frac(e), ms = Math.round(performance.now() - down.t), moved = Math.hypot(up.x - down.x, (up.y - down.y) * 9 / 16) > 0.015;
  const inside = (p) => p.x >= 0 && p.x <= 1 && p.y >= 0 && p.y <= 1;
  if (inside(down)) {
    const ring = document.createElement("div"); ring.className = "ripple"; ring.style.left = down.px + "px"; ring.style.top = down.py + "px"; scr.appendChild(ring); setTimeout(() => ring.remove(), 500);
    const body = !moved && ms < 500 ? {type: "tap", x: down.x, y: down.y}
               : {type: "swipe", x1: down.x, y1: down.y, x2: moved ? up.x : down.x, y2: moved ? up.y : down.y, ms: Math.min(Math.max(ms, 120), 3000)};
    call("/api/control", body).catch((err) => toast(err.message));
  }
  down = null;
});

// Agent log: the playing session's transcript from /feed (same events as the viewer), newest on top
const list = $("list"), calls = new Map();
let actions = 0;
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const clock = (iso) => iso ? new Date(iso).toLocaleTimeString([], {hour12: false}) : "";
function entry(cls, text, iso) {
  const n = el("div", "ev " + cls);
  if (iso) n.append(el("span", "t", clock(iso)));
  if (text !== undefined) n.append(text);
  return n;
}
function push(n) {
  list.querySelector(".empty")?.remove();
  list.prepend(n);
  while (list.childElementCount > 500) list.lastElementChild.remove();
}
function preview(value) {
  if (value && typeof value === "object" && !Array.isArray(value)) {
    const parts = [];
    if (value.screen && !Array.isArray(value.cards)) parts.push(value.screen);
    if (value.battle) parts.push(`wave ${value.battle.wave} turn ${value.battle.turn_in_wave}`);
    if (Array.isArray(value.cards)) {
      const letter = {buster: "B", arts: "A", quick: "Q"};
      parts.push("cards " + value.cards.map((c) => (letter[c.type] || "-") + (c.affinity === "weak" ? "!" : "")).join(" "));
    }
    if (value.note) parts.push(value.note);
    if (value.warning) parts.push("⚠ " + value.warning);
    if (parts.length) return parts.join(" · ");
  }
  return JSON.stringify(value);
}
function result(card, ev) {
  card.querySelector(".pending")?.remove();
  const text = ev.text || "", d = el("details", "res"), body = el("pre");
  let summary;
  try { const v = JSON.parse(text); summary = preview(v); body.textContent = JSON.stringify(v, null, 2); }
  catch { summary = text.split("\n")[0] || "(no text)"; body.textContent = text; }
  d.append(el("summary", "", summary), body);
  card.append(d);
  if (ev.error) card.classList.add("err");
}
list.addEventListener("click", (e) => {
  const ev = e.target.closest(".ev");
  if (!ev || e.target.closest("details")) return;
  if (ev.matches(".think, .prompt") || e.target.closest(".line")) ev.classList.toggle("open");
});
function show(ev) {
  switch (ev.kind) {
    case "session":
      list.replaceChildren(el("div", "empty", "Session started, waiting for the agent")); calls.clear(); actions = 0; $("count").textContent = 0;
      $("session").textContent = ev.id.slice(0, 8); break;
    case "prompt": push(entry("prompt", ev.text, ev.time)); break;
    case "say": push(entry("say", ev.text, ev.time)); break;
    case "think": push(entry("think", ev.text, ev.time)); break;
    case "call": {
      const line = el("div", "line");
      line.append(el("span", "t", clock(ev.time)), el("span", "name", ev.tool));
      const args = JSON.stringify(ev.args);
      if (args !== "{}") line.append(el("span", "args", args));
      const card = entry("call");
      card.append(line, el("div", "pending", "running..."));
      calls.set(ev.id, card); push(card);
      $("count").textContent = ++actions; break;
    }
    case "result": { const card = calls.get(ev.id); if (card) result(card, ev); break; }
    case "cost": if (ev.usd != null) { $("cost").textContent = "$" + ev.usd.toFixed(2); $("costBox").hidden = false; } break;
  }
}
(function connect() {
  const source = new EventSource("/feed");
  source.onopen = () => $("dot").classList.add("live");
  source.onmessage = (m) => show(JSON.parse(m.data));
  source.onerror = () => $("dot").classList.remove("live");
})();

poll(); setInterval(poll, 3000);
</script>
</body>
</html>
